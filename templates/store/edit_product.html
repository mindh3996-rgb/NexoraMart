<!DOCTYPE html>
<html>
<head>

<title>Edit Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">


<div class="container py-5">


<div class="card shadow p-4">


<h2 class="text-center mb-4">
✏️ Edit Product
</h2>


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


<div class="mb-3">

<label class="form-label">
Category
</label>

<select name="category" class="form-select">

{% for category in categories %}

<option value="{{ category.id }}"
{% if category.id == product.category.id %}
selected
{% endif %}>

{{ category.name }}

</option>

{% endfor %}

</select>

</div>



<div class="mb-3">

<label class="form-label">
Product Name
</label>

<input 
type="text"
name="name"
class="form-control"
value="{{ product.name }}"
required>

</div>



<div class="mb-3">

<label class="form-label">
Price
</label>

<input 
type="number"
name="price"
class="form-control"
value="{{ product.price }}"
required>

</div>



<div class="mb-3">

<label class="form-label">
Description
</label>

<textarea 
name="description"
class="form-control"
rows="4">{{ product.description }}</textarea>

</div>



<div class="mb-3">

<label class="form-label">
Current Image
</label>

<br>

<img src="{{ product.image.url }}"
width="100"
class="mb-3">


<input 
type="file"
name="image"
class="form-control">

</div>



<button class="btn btn-primary w-100">

Update Product

</button>


</form>


</div>


</div>


</body>
</html>
