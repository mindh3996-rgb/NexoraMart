<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">
Checkout
</h2>


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


<div class="mb-3">
<label>Name</label>
<input type="text" 
name="name" 
class="form-control"
required>
</div>


<div class="mb-3">
<label>Phone Number</label>
<input type="text"
name="phone"
class="form-control"
required>
</div>


<div class="mb-3">
<label>Address</label>
<textarea 
name="address"
class="form-control"
required></textarea>
</div>


<div class="mb-3">
<label>City</label>
<input type="text"
name="city"
class="form-control"
required>
</div>
<hr>

<h5>Payment Method</h5>

<div class="form-check">
    <input class="form-check-input"
           type="radio"
           name="payment_method"
           value="COD"
           checked>

    <label class="form-check-label">
        Cash on Delivery
    </label>
</div>
<div class="form-check">
    <input
        class="form-check-input"
        type="radio"
        name="payment_method"
        value="EASYPAISA"
        id="easypaisa">

    <label class="form-check-label" for="easypaisa">
        Easypaisa
    </label>
</div>

<div class="form-check mb-3">
    <input
        class="form-check-input"
        type="radio"
        name="payment_method"
        value="JAZZCASH"
        id="jazzcash">

    <label class="form-check-label" for="jazzcash">
        JazzCash
    </label>
</div>
<!-- Easypaisa -->
<div id="easypaisaBox" style="display:none;" class="border rounded p-3 mb-3">

    <h5>📱 Easypaisa Payment</h5>

    <p>Send payment to:</p>

    <strong>0321-1234567</strong>

    <div class="mt-3">
        <label>Transaction ID</label>

        <input
            type="text"
            name="easypaisa_transaction"
            class="form-control">
    </div>

    <div class="mt-3">
        <label>Upload Screenshot</label>

        <input
            type="file"
            name="easypaisa_screenshot"
            class="form-control"
            accept="image/*">
    </div>

</div>

<!-- JazzCash -->
<div id="jazzcashBox" style="display:none;" class="border rounded p-3 mb-3">

    <h5>💳 JazzCash Payment</h5>

    <p>Send payment to:</p>

    <strong>0300-9876543</strong>

    <div class="mt-3">
        <label>Transaction ID</label>

        <input
            type="text"
            name="jazzcash_transaction"
            class="form-control">
    </div>

    <div class="mt-3">
        <label>Upload Screenshot</label>

        <input
            type="file"
            name="jazzcash_screenshot"
            class="form-control"
            accept="image/*">
    </div>

</div>


<h4>
    Total: Rs{{ total }}
</h4>

<hr>
<h5>Apply Coupon</h5>

<div class="mb-3">
    <label>Coupon Code</label>

    <input
        type="text"
        name="coupon"
        class="form-control"
        placeholder="Enter Coupon Code">
</div>

<button class="btn btn-success mb-5">
    Place Order
</button>


</form>


</div>


</div>
<script>

const methods = document.querySelectorAll('input[name="payment_method"]');

const easypaisaBox = document.getElementById("easypaisaBox");
const jazzcashBox = document.getElementById("jazzcashBox");

function togglePaymentBoxes(){

    const selected = document.querySelector('input[name="payment_method"]:checked').value;

    // Sab boxes hide
    easypaisaBox.style.display = "none";
    jazzcashBox.style.display = "none";

    // Easypaisa
    if(selected === "EASYPAISA"){
        easypaisaBox.style.display = "block";
    }

    // JazzCash
    if(selected === "JAZZCASH"){
        jazzcashBox.style.display = "block";
    }

    // COD me dono hide rahenge
}

methods.forEach(function(item){

    item.addEventListener("change", togglePaymentBoxes);

});

// Page load par bhi check karo
togglePaymentBoxes();

</script>
</body>
</html>
