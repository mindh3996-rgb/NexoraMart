<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">
Checkout
</h2>


<form method="POST">

{% csrf_token %}


<div class="mb-3">
<label>Name</label>
<input type="text" 
name="name" 
class="form-control"
required>
</div>


<div class="mb-3">
<label>Phone Number</label>
<input type="text"
name="phone"
class="form-control"
required>
</div>


<div class="mb-3">
<label>Address</label>
<textarea 
name="address"
class="form-control"
required></textarea>
</div>


<div class="mb-3">
<label>City</label>
<input type="text"
name="city"
class="form-control"
required>
</div>
<hr>

<h5>Payment Method</h5>

<div class="form-check">
    <input
        class="form-check-input"
        type="radio"
        name="payment_method"
        value="COD"
        checked>

    <label class="form-check-label">
        Cash on Delivery
    </label>
</div>

<div class="form-check mb-3">
    <input
        class="form-check-input"
        type="radio"
        name="payment_method"
        value="ONLINE">

    <label class="form-check-label">
        Online Payment
    </label>
</div>

<h4>
Total: Rs{{ total }}
</h4>
<hr>

<h5>Apply Coupon</h5>

<div class="mb-3">
    <label>Coupon Code</label>

    <input
        type="text"
        name="coupon"
        class="form-control"
        placeholder="Enter Coupon Code">
</div>


<button class="btn btn-success">
Place Order
</button>


</form>


</div>

</body>
</html>
