<!DOCTYPE html>
<html>
<head>

<title>Add Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">


<div class="container py-5">


<div class="card shadow p-4">

<h2 class="mb-4 text-center">
    ➕ Add New Product
</h2>


<form method="POST" enctype="multipart/form-data">

{% csrf_token %}


<div class="mb-3">

<label class="form-label">
Category
</label>

<select name="category" class="form-select">

{% for category in categories %}

<option value="{{ category.id }}">
{{ category.name }}
</option>

{% endfor %}

</select>

</div>



<div class="mb-3">

<label class="form-label">
Product Name
</label>

<input 
type="text"
name="name"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">
Price
</label>

<input 
type="number"
name="price"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">
Description
</label>

<textarea 
name="description"
class="form-control"
rows="4">
</textarea>

</div>



<div class="mb-3">

<label class="form-label">
Product Image
</label>

<input 
type="file"
name="image"
class="form-control"
required>

</div>



<button class="btn btn-success w-100">

Add Product

</button>


</form>


</div>


</div>


</body>
</html>
