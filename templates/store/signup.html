{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexora Mart - Signup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">


            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">
                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               name="full_name"
                               class="form-control"
                               placeholder="Enter your full name"
                               required>
                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter your email"
                               required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Create username"
                               required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Create password"
                               required>

                    </div>
                    <div class="mb-3">

    <label class="form-label">
        Confirm Password
    </label>

    <input type="password"
           name="confirm_password"
           class="form-control"
           placeholder="Confirm password"
           required>

</div>


                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               placeholder="03xxxxxxxxx"
                               required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea name="address"
                                  class="form-control"
                                  placeholder="Enter your address"
                                  required></textarea>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            City
                        </label>

                        <input type="text"
                               name="city"
                               class="form-control"
                               placeholder="Enter your city"
                               required>

                    </div>


                    <button class="btn btn-dark w-100">
                        Signup
                    </button>


                </form>


                <p class="text-center mt-3">

                    Already have an account?

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                </p>


            </div>


        </div>

    </div>

</div>


</body>
</html>
